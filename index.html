<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026泰國</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  :root{
    --bg:#F2F1EF;
    --ink:#1a1a1a;
    --soft:#767676;
    --line:#c9c6c1;
    --line-soft:#dedbd6;
    --serif:'Playfair Display','Songti TC',Georgia,serif;   /* 只用於大型展示標題與英文裝飾小標 */
    --sans:-apple-system,BlinkMacSystemFont,'Inter','Noto Sans TC','PingFang TC','Segoe UI','Microsoft JhengHei',sans-serif;
    /* 泰式低飽和色盤：主色鼠尾草綠，功能性上色用，文字主體維持碳灰 */
    --blue:#5C7A5E;  --blue-soft:#E7EEE7;
    --terra:#C1666B; --terra-soft:#F5E6E6;
    --sage:#84A98C;  --sage-soft:#E8F0EA;
    --gold:#C9A227;  --gold-soft:#F5EED6;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:var(--sans);
    background:var(--bg);color:var(--ink);
    font-size:16px;line-height:1.7;letter-spacing:.01em;font-weight:400;
  }
  a{color:inherit;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;}

  /* ===== Header ===== */
  header.hero{
    background:var(--bg);color:var(--ink);
    padding:38px 20px 22px;text-align:center;
  }
  header.hero .eyebrow{
    font-family:var(--serif);
    font-size:.68rem;letter-spacing:.45em;color:var(--soft);
    text-transform:uppercase;margin-bottom:12px;
  }
  header.hero h1{
    font-family:'Playfair Display',var(--serif);
    font-size:1.6rem;font-weight:500;letter-spacing:.12em;
  }
  header.hero .sub{font-size:.8rem;color:var(--soft);margin-top:8px;letter-spacing:.12em;}

  /* ===== Tab bar ===== */
  nav.tabbar{
    position:sticky;top:0;z-index:50;
    background:var(--bg);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabbar::-webkit-scrollbar{display:none;}
  nav.tabbar button{
    flex:0 0 auto;appearance:none;border:none;background:none;cursor:pointer;
    font-family:var(--sans);
    padding:13px 15px 12px;font-size:.85rem;color:var(--soft);
    letter-spacing:.08em;font-weight:500;white-space:nowrap;
    border-bottom:1px solid transparent;
  }
  nav.tabbar button.active{color:var(--ink);border-bottom-color:var(--ink);font-weight:600;}

  main{max-width:860px;margin:0 auto;padding:8px 20px 90px;}
  section.panel{display:none;}
  section.panel.active{display:block;animation:fadein .3s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ===== Sections（去卡片化：細分隔線分區）===== */
  .card{
    background:transparent;border:none;border-radius:0;box-shadow:none;
    border-top:1px solid var(--line);
    padding:26px 0 30px;margin:0;
  }
  section.panel > .card:first-child{border-top:none;}
  .card h3{
    font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;
    font-weight:700;color:var(--ink);margin-bottom:16px;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  }
  .card h3 .no{color:var(--soft);letter-spacing:.08em;font-weight:500;}
  .card h3 .en{font-family:var(--serif);color:var(--soft);letter-spacing:.26em;font-weight:500;font-size:.7rem;}
  .card h3 .ic{width:17px;height:17px;flex:0 0 auto;}
  .kv{display:flex;flex-wrap:wrap;gap:4px 0;font-size:.95rem;padding:6px 0;border-bottom:1px solid var(--line-soft);}
  .kv:last-child{border-bottom:none;}
  .kv .k{flex:0 0 7.5em;color:var(--soft);letter-spacing:.08em;font-weight:500;}
  .kv .v{flex:1;min-width:12em;font-weight:500;}
  .muted{color:var(--soft);font-size:.87rem;}
  /* 單色線條 icon 基本樣式 */
  .ic{
    width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    vertical-align:-3px;display:inline-block;
  }
  .ic.sm{width:14px;height:14px;vertical-align:-2px;}
  .kv .k .ic{margin-right:6px;}
  nav.tabbar button .ic{width:14px;height:14px;vertical-align:-2px;margin-right:6px;}

  /* ===== Clocks ===== */
  .clocks{display:flex;}
  .clock{
    flex:1;text-align:left;padding:6px 0 6px 20px;
    border-left:1px solid var(--line);
  }
  .clock:first-child{border-left:none;padding-left:0;}
  .clock .zone{font-size:.72rem;color:var(--soft);letter-spacing:.16em;text-transform:uppercase;font-weight:500;}
  .clock .time{font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;}
  .clock .date{font-size:.8rem;color:var(--soft);letter-spacing:.08em;font-weight:500;}

  /* ===== Weather ===== */
  .wx-grid{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;}
  .wx-day{
    flex:0 0 auto;min-width:132px;background:transparent;
    border-left:1px solid var(--line-soft);border-radius:0;
    padding:6px 14px;font-size:.84rem;text-align:left;
  }
  .wx-day:first-child{border-left:none;padding-left:0;}
  .wx-day .d{font-weight:600;color:var(--ink);letter-spacing:.06em;}
  .wx-day .t{font-size:1.15rem;font-weight:600;}

  /* ===== Prep checklist ===== */
  .progress-wrap{margin-bottom:18px;}
  .progress-bar{height:2px;background:var(--line-soft);border-radius:0;overflow:hidden;}
  .progress-bar > div{height:100%;background:var(--ink);border-radius:0;transition:width .3s;}
  .prep-cat{margin-bottom:14px;}
  .prep-cat h4{
    font-size:.86rem;color:var(--ink);background:transparent;
    border-bottom:1px solid var(--line);
    padding:8px 0;border-radius:0;margin-bottom:2px;
    letter-spacing:.08em;font-weight:700;
  }
  .prep-cat h4 .no{color:var(--soft);margin-right:10px;letter-spacing:.04em;font-weight:500;}
  .prep-cat h4 .ic{margin-right:8px;}
  label.prep-item{
    display:flex;align-items:flex-start;gap:12px;padding:11px 0;
    border-bottom:1px solid var(--line-soft);cursor:pointer;font-size:.95rem;
  }
  label.prep-item:last-child{border-bottom:none;}
  label.prep-item input{
    appearance:none;-webkit-appearance:none;
    width:15px;height:15px;margin-top:7px;flex:0 0 auto;
    border:1px solid var(--ink);border-radius:0;background:transparent;
    position:relative;cursor:pointer;
  }
  label.prep-item input:checked{background:var(--ink);}
  label.prep-item input:checked::after{
    content:"";position:absolute;left:4px;top:0px;width:4px;height:9px;
    border:solid var(--bg);border-width:0 1px 1px 0;transform:rotate(45deg);
  }
  label.prep-item .txt .name{font-weight:600;}
  label.prep-item.done .txt .name{text-decoration:line-through;color:var(--soft);}
  .deadline{
    display:inline-block;font-size:.74rem;background:transparent;
    border:1px solid var(--line);color:var(--soft);
    border-radius:999px;padding:0 10px;margin-left:8px;letter-spacing:.08em;
  }

  /* ===== Day flow (node graph) ===== */
  .flow-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 2px 14px;}
  .flow{display:flex;align-items:flex-start;min-width:min-content;}
  .flow-node{flex:0 0 auto;text-align:center;width:112px;}
  .flow-node .dot{
    width:36px;height:36px;line-height:34px;border-radius:50%;margin:0 auto 8px;
    background:transparent;border:1px solid var(--ink);
    color:var(--ink);font-weight:400;font-size:.9rem;
  }
  .flow-node .nm{font-size:.86rem;font-weight:600;line-height:1.4;letter-spacing:.02em;}
  .flow-node .st{font-size:.76rem;color:var(--soft);letter-spacing:.04em;font-weight:500;}
  .flow-link{
    flex:0 0 auto;width:44px;height:1px;margin-top:18px;
    background:var(--line);position:relative;
  }
  .flow-link::after{
    content:"";position:absolute;right:0;top:-2.5px;width:5px;height:5px;
    border-top:1px solid var(--ink);border-right:1px solid var(--ink);
    transform:rotate(45deg);
  }

  /* ===== Spot ===== */
  .spot{padding-top:26px;}
  .spot .spot-head{padding:0 0 12px;}
  .spot h3{
    font-size:1.22rem;font-weight:700;color:var(--ink);margin-bottom:2px;
    letter-spacing:.01em;text-transform:none;display:block;
  }
  .spot h3 a{text-decoration:none;border-bottom:1px solid var(--ink);}
  .spot h3 .ic{width:15px;height:15px;margin-left:6px;vertical-align:-1px;}
  .spot .order-badge{
    display:inline-block;background:transparent;color:var(--soft);border-radius:0;
    font-size:.72rem;padding:0;margin-bottom:8px;font-weight:600;letter-spacing:.18em;
    text-transform:uppercase;
  }
  .spot .stay{font-size:.84rem;color:var(--soft);margin-bottom:12px;letter-spacing:.04em;font-weight:500;font-variant-numeric:tabular-nums;}
  .spot .stay .ic{margin-right:5px;}
  .spot .body{padding:14px 0 0;}
  .spot .intro{font-size:.95rem;}
  .spot .intro p{margin:0 0 7px;}
  .spot .intro p:last-child{margin-bottom:0;}
  .wx-overall{font-size:.9rem;margin-bottom:14px;}
  .wx-overall p{margin:0 0 5px;}
  .ss-dress .dl{margin-bottom:7px;}
  .ss-dress .dl:last-child{margin-bottom:0;}
  .kv .v .vl{margin-bottom:5px;}
  .kv .v .vl:last-child{margin-bottom:0;}
  .tr-when > div{margin-bottom:3px;}

  /* ===== Carousel ===== */
  .carousel{position:relative;}
  .car-track{
    display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .car-track::-webkit-scrollbar{display:none;}
  .car-track img{
    flex:0 0 100%;width:100%;aspect-ratio:16/9;object-fit:cover;
    scroll-snap-align:center;display:block;border-radius:0;
    background:#e5e2dd;
  }
  .car-btn{
    position:absolute;top:50%;transform:translateY(-50%);
    width:30px;height:30px;border-radius:999px;cursor:pointer;
    background:rgba(242,241,239,.85);color:var(--ink);
    border:1px solid var(--ink);
    font-size:.95rem;line-height:1;font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
  }
  .car-btn.prev{left:10px;}
  .car-btn.next{right:10px;}
  .car-dots{
    position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:7px;
  }
  .car-dots span{
    width:16px;height:2px;border-radius:0;background:rgba(255,255,255,.72);
    box-shadow:0 0 2px rgba(0,0,0,.45);
  }
  .car-dots span.on{background:var(--ink);box-shadow:0 0 0 1px rgba(255,255,255,.75);}

  /* ===== Notice block ===== */
  .notice{
    background:transparent;
    border:1px solid var(--line);border-left:2px solid var(--ink);
    border-radius:0;padding:12px 16px;margin-top:14px;font-size:.9rem;
  }
  .notice .nt-title{
    font-weight:700;color:var(--ink);margin-bottom:6px;
    font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;
  }
  .notice ul{list-style:none;}
  .notice li{padding:3px 0;display:flex;gap:9px;}
  .notice li .ic{flex:0 0 auto;margin-top:7px;color:var(--soft);}

  /* ===== Tomorrow preview ===== */
  .tomorrow{
    background:transparent;
    border:1px solid var(--line);border-top:1px solid var(--line);
    padding:22px 20px 24px;margin-top:30px;
  }

  /* ===== Expense ===== */
  .stats{display:grid;grid-template-columns:1fr;gap:0;margin-bottom:26px;border-top:1px solid var(--line);}
  @media(min-width:640px){.stats{grid-template-columns:1fr 1fr 1fr;}}
  .stat-card{
    background:transparent;border:none;border-bottom:1px solid var(--line-soft);
    border-radius:0;padding:16px 4px;box-shadow:none;
  }
  @media(min-width:640px){
    .stat-card{border-bottom:none;border-left:1px solid var(--line-soft);padding:18px 18px;}
    .stat-card:first-child{border-left:none;padding-left:4px;}
  }
  .stat-card .t{font-size:.74rem;color:var(--soft);margin-bottom:6px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;}
  .stat-card .t .ic{margin-right:6px;}
  .stat-card .big{font-size:1.5rem;font-weight:700;color:var(--ink);letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .stat-card .row{display:flex;justify-content:space-between;font-size:.88rem;padding:3px 0;}
  .stat-card .row b{font-variant-numeric:tabular-nums;font-weight:600;}

  .table-wrap{
    overflow-x:auto;-webkit-overflow-scrolling:touch;
    background:transparent;border:none;border-radius:0;box-shadow:none;
  }
  table.expense{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem;}
  table.expense th{
    background:transparent;color:var(--soft);text-align:left;padding:10px 14px 8px;
    white-space:nowrap;font-weight:600;font-size:.75rem;
    letter-spacing:.1em;text-transform:uppercase;
    border-bottom:1px solid var(--ink);
  }
  table.expense th:first-child{padding-left:0;}
  table.expense td{padding:11px 14px;border-bottom:1px solid var(--line-soft);white-space:nowrap;}
  table.expense td:first-child{padding-left:0;}
  table.expense td.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;}
  .badge{
    display:inline-block;border-radius:999px;padding:1px 12px;
    font-size:.75rem;font-weight:500;letter-spacing:.12em;
    background:transparent;border:1px solid var(--soft);color:var(--soft);
  }
  .badge.paid{border-color:var(--ink);color:var(--ink);}
  .badge.pending{border-color:var(--soft);color:var(--soft);}
  .badge.refund{border-style:dashed;border-color:var(--soft);color:var(--soft);}

  /* ===== 配色套用（功能性、有節制） ===== */
  .ic-blue{color:var(--blue);}
  .ic-gold{color:var(--gold);}
  .ic-terra{color:var(--terra);}
  .ic-sage{color:var(--sage);}
  .card h3 .ic{color:var(--blue);}
  .card h3 .no{color:var(--blue);}
  .card h3 .en{color:var(--terra);}
  nav.tabbar button.active{color:var(--blue);border-bottom-color:var(--blue);}
  a:hover{color:var(--blue);}
  .car-btn:hover{background:var(--blue);border-color:var(--blue);color:#fff;}
  .flow-node .dot{border-color:var(--blue);color:var(--blue);}
  .flow-node .st{color:var(--terra);font-weight:600;}
  .flow-link::after{border-top-color:var(--blue);border-right-color:var(--blue);}
  .wx-day .t{color:var(--blue);}
  label.prep-item input:checked{background:var(--blue);border-color:var(--blue);}
  .progress-bar > div{background:var(--blue);}
  .prep-cat h4{border-left:3px solid var(--line);padding-left:10px;}
  .prep-cat.c0 h4{border-left-color:var(--blue);}  .prep-cat.c0 h4 .ic{color:var(--blue);}
  .prep-cat.c1 h4{border-left-color:var(--terra);} .prep-cat.c1 h4 .ic{color:var(--terra);}
  .prep-cat.c2 h4{border-left-color:var(--sage);}  .prep-cat.c2 h4 .ic{color:var(--sage);}
  .prep-cat.c3 h4{border-left-color:var(--gold);}  .prep-cat.c3 h4 .ic{color:var(--gold);}
  .notice{border-left-color:var(--blue);}
  .notice li .ic.ic-blue{color:var(--blue);}
  .notice li .ic.ic-gold{color:var(--gold);}
  .notice li .ic.ic-terra{color:var(--terra);}
  .notice li .ic.ic-sage{color:var(--sage);}
  .badge.paid{border-color:var(--sage);color:var(--sage);}
  .badge.pending{border-color:var(--gold);color:var(--gold);}
  .chip{
    display:inline-block;background:var(--blue-soft);color:var(--blue);
    border-radius:999px;padding:1px 10px;font-size:.75rem;font-weight:500;
  }
  .ov-row .ov-day{border-color:var(--blue);color:var(--blue);}
  .tr-when{color:var(--terra);}

  /* ===== 基本資料：雜誌式版面 ===== */
  .info-hero{
    display:flex;flex-wrap:wrap;gap:18px 44px;
    justify-content:space-between;align-items:flex-end;padding-top:30px;
  }
  .ih-count{display:flex;align-items:baseline;gap:10px;}
  .ih-num{font-size:3.4rem;font-weight:700;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums;}
  .ih-unit{font-size:1rem;font-weight:600;letter-spacing:.05em;}
  .ih-dates{margin-top:8px;font-weight:500;}
  .ih-clocks{flex:0 1 360px;min-width:270px;}
  .info-grid{display:grid;grid-template-columns:1fr;column-gap:48px;}
  @media(min-width:820px){
    .info-grid{grid-template-columns:3fr 2fr;}
  }
  .fl-dir{
    font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--blue);margin:16px 0 10px;
  }
  .fl-dir .ic{margin-right:6px;}
  .fl-tl{border-left:1px solid var(--line);margin-left:7px;padding-left:22px;}
  .fl-node{position:relative;padding:2px 0;}
  .fl-node::before{
    content:"";position:absolute;left:-27.5px;top:11px;width:9px;height:9px;
    border-radius:50%;background:var(--bg);border:2px solid var(--blue);
  }
  .fl-node > .ic{color:var(--blue);margin-left:2px;}
  .fl-time{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;margin-right:8px;}
  .fl-date{color:var(--soft);font-size:.85rem;margin-right:8px;font-variant-numeric:tabular-nums;font-weight:500;}
  .fl-ap{font-size:.9rem;font-weight:500;}
  .fl-meta{font-size:.8rem;color:var(--soft);padding:8px 0 14px;line-height:1.6;}
  .sun-strip{display:flex;flex-wrap:wrap;gap:16px 44px;align-items:flex-start;}
  .ss-sun{flex:0 0 auto;font-size:.95rem;}
  .ss-sun b{font-weight:700;margin-left:4px;}
  .ss-dress{flex:1;min-width:250px;font-size:.92rem;}

  /* ===== 旅程總覽 ===== */
  .ov-summary{font-size:1.05rem;font-weight:600;letter-spacing:.06em;margin-bottom:4px;}
  .ov-flight{font-size:.92rem;padding:5px 0;border-bottom:1px solid var(--line-soft);}
  .ov-flight:last-child{border-bottom:none;}
  .ov-flight .ic{margin-right:8px;}
  .ov-row{
    display:block;width:100%;text-align:left;cursor:pointer;
    appearance:none;background:none;border:none;font-family:var(--sans);color:var(--ink);
    padding:13px 0;border-bottom:1px solid var(--line-soft);
    font-size:.95rem;line-height:1.7;letter-spacing:.01em;
  }
  .ov-row:hover .ov-day{border-color:var(--ink);}
  .ov-row .ov-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .ov-row .ov-day{
    font-weight:600;letter-spacing:.06em;font-size:.78rem;text-transform:uppercase;
    border:1px solid var(--line);border-radius:999px;padding:0 10px;
  }
  .ov-row .ov-date{color:var(--soft);font-size:.85rem;font-weight:500;}
  .ov-row .ov-theme{font-weight:600;}
  .ov-row .ov-spots{color:var(--soft);font-size:.88rem;display:block;margin-top:2px;}
  .ov-row .ov-spots .ic{margin-right:6px;}
  .ov-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:4px;}
  .ov-stats .st{font-size:.9rem;}
  .ov-stats .st b{font-size:1.4rem;font-weight:600;margin-right:6px;}

  /* ===== 交通資訊 ===== */
  .tr-when{font-size:.85rem;color:var(--soft);letter-spacing:.06em;margin:-8px 0 10px;font-weight:500;}
  .tr-imgs{display:flex;gap:10px;overflow-x:auto;padding:12px 0 4px;}
  .tr-imgs img{
    height:120px;width:auto;flex:0 0 auto;display:block;border-radius:0;
    cursor:zoom-in;background:#e5e2dd;
  }
  .tr-map-hint{font-size:.78rem;color:var(--soft);letter-spacing:.08em;margin-top:4px;}

  /* ===== 記帳輸入與同步 ===== */
  .ef-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px;}
  @media(min-width:760px){.ef-grid{grid-template-columns:repeat(4,1fr);}}
  .ef-f label{display:block;font-size:.74rem;color:var(--soft);letter-spacing:.06em;margin-bottom:3px;}
  .ef-f input,.ef-f select{
    width:100%;padding:8px 10px;font-family:var(--sans);font-size:.95rem;
    background:transparent;border:1px solid var(--line);border-radius:0;color:var(--ink);
  }

  /* ==================== 1. 基本資料（雜誌式版面） ==================== */
  (function renderInfo() {

    let html = "";

    const flNode = (pt, icon) => {

    /* 雙時鐘即時更新 */
    function clockParts(tz) {
      const parts = new Intl.DateTimeFormat("zh-Hant-TW", {
        timeZone: tz, hour12: false,
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", second: "2-digit", weekday: "short"
      }).formatToParts(new Date());
      const g = t => (parts.find(x => x.type === t) || {}).value || "";
      return {
        time: pad2(g("hour") === "24" ? "00" : g("hour")) + ":" + g("minute") + ":" + g("second"),
        date: g("month") + "/" + g("day") + "（" + g("weekday").replace("週", "") + "）"
      };

    setInterval(tick, 1000);

        + '（' + g.map(f => esc(f.flightNo)).join("＋") + via + '）</div>';
    };
    html += '<div class="card"><h3>' + secTitle("02", "航班摘要", "Flights", "plane") + '</h3>'
      + groupLine("去程") + groupLine("回程") + '</div>';

    /* 每日一列總覽，點擊跳該天頁籤 */

        + '<span class="ov-theme">' + esc(zone) + '</span></span>'
        + '<span class="ov-spots">' + ic("walk", "sm") + esc(chain) + '</span>'
        + '</button>';
    });
    html += '<p class="muted" style="margin-top:10px;">點任一天可直接跳到該天的行程頁</p></div>';

    /* 統計 */
    const allSpots = D.days.reduce((a, d) => a.concat(d.spots), []);
    const paid = allSpots.filter(s => /需門票|需購票/.test(((s.notice || {}).ticket) || "")).length;
    const resv = allSpots.filter(s => /預約/.test(((s.notice || {}).ticket) || "")).length;
    html += '<div class="card"><h3>' + secTitle("04", "統計", "Stats", "tag") + '</h3>'

      + '<span class="st"><b>' + paid + '</b>處需購票</span>'
      + '<span class="st"><b>' + resv + '</b>處需預約／時段票</span>'
      + '</div></div>';

    p.innerHTML = html;
    $$(".ov-row", p).forEach(r => r.addEventListener("click", () => activate("day" + r.dataset.day)));
  })();

  /* ---------- 敏感資料 UI：鎖定顯示／解鎖 modal／sessionStorage ---------- */
  function renderTravelers() {
    const box = $("#travelers-box");
    if (!box) return;
    if (SEC.data && Array.isArray(SEC.data.travelers) && SEC.data.travelers.length) {
      box.innerHTML = SEC.data.travelers.map(t =>
        '<div style="padding:6px 0;border-bottom:1px solid var(--line-soft);">'
        + '<div style="font-weight:600;">' + esc(t.name || "") + ' <span class="muted">' + esc(t.passportName || "") + '</span></div>'
        + '<div class="muted">護照號碼 ' + esc(t.passportNo || "—") + '　效期至 ' + esc(t.expiry || "—") + '</div>'
        + '<div class="muted">台胞證號碼 ' + esc(t.tbzNo || "—") + '　效期至 ' + esc(t.tbzExpiry || "—") + '</div></div>').join("");
    } else if (TRIP_DATA.secure) {
      box.innerHTML = '<div class="sec-block sec-locked" title="點擊解鎖">' + ic("lock", "sm")
        + ' 旅伴護照資料已加密，點擊解鎖查看'
        + '<div class="dots">●●●　●●●●●●●●●　●●●●／●●／●●</div></div>';
    } else {
      box.innerHTML = '<div class="sec-block">' + ic("lock", "sm")
        + ' 敏感資料尚未設定 — 在本機開啟 encrypt.html，輸入護照與訂位資料並設定密碼產生密文，貼入 TRIP_DATA.secure 即可。</div>';
    }
  }

  /* 旅伴大頭貼：Google 頭像自動收集於 Firestore meta/members（登入時 upsert），
     以「姓名字母重組相同」比對 TRIP_DATA.membersPublic（如 CHANG RONG JIA ↔ Rongjia Chang）；
     未登入過（或未登入看不到 Firestore）→ 字母圓點＋英文名；收集到但不在名單的 profile 也一併展示。 */
  const MEM = { profiles: {}, unsub: null };
  function memWatch() {
    if (MEM.unsub) { MEM.unsub(); MEM.unsub = null; }
    MEM.profiles = {};
    renderMembers();
    if (!FB.user) return;
    MEM.unsub = FB.fs.onSnapshot(
      FB.fs.doc(FB.db, "trips", TRIP_DATA.id, "meta", "members"),
      s => { const dd = s.data() || {}; MEM.profiles = dd.profiles || {}; renderMembers(); },
      () => {}
    );
  }
  function renderMembers() {
    const box = $("#members-box");
    if (!box) return;
    const pub = TRIP_DATA.membersPublic || [];
    const profs = Object.values(MEM.profiles || {}).filter(p => p && p.name);
    if (!pub.length && !profs.length) { box.innerHTML = '<p class="muted">成員資料待補</p>'; return; }
    const canon = s => String(s || "").toLowerCase().replace(/[^a-z]/g, "").split("").sort().join("");
    const used = new Set();
    const cards = pub.map(m => {
      const hit = profs.find(p => !used.has(p) && canon(p.name) === canon(m.name));
      if (hit) used.add(hit);
      return { name: m.name, picture: hit ? (hit.picture || "") : "" };
    });
    profs.filter(p => !used.has(p)).forEach(p => cards.push({ name: p.name, picture: p.picture || "" }));
    box.innerHTML = '<div class="mem-grid">' + cards.map(c => {
      const letter = esc(String(c.name || "?").trim().charAt(0).toUpperCase());
      const avatar = c.picture
        ? '<img class="mem-ava" src="' + esc(c.picture) + '" alt="" referrerpolicy="no-referrer"'
          + ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'
          + '<span class="mem-ava mem-ava-letter" style="display:none;">' + letter + '</span>'
        : '<span class="mem-ava mem-ava-letter">' + letter + '</span>';
      return '<div class="mem-person">' + avatar + '<div class="mem-pname">' + esc(c.name) + '</div></div>';
    }).join('') + '</div>';
  }

  function refreshSecure() {
    $$("[data-sec]").forEach(el => { el.innerHTML = secDisplay(el.dataset.sec); });
    renderTravelers();
    renderMembers();
    const btn = $("#lock-btn");
    if (btn) {
      if (!TRIP_DATA.secure) btn.innerHTML = ic("lock", "sm") + ' 敏感資料未設定';
      else if (SEC.data) btn.innerHTML = ic("unlock", "sm") + ' 已解鎖・點此鎖定';
      else btn.innerHTML = ic("lock", "sm") + ' 解鎖敏感資料';
    }
  }

  function openSecModal() {
    if (!TRIP_DATA.secure || SEC.data || $(".sec-modal")) return;
    const box = document.createElement("div");
    box.className = "sec-modal";
    box.innerHTML = '<div class="sec-card">'
      + '<h4>' + ic("lock", "sm") + ' 解鎖敏感資料</h4>'
      + '<p class="muted">輸入密碼顯示護照、訂位代號等資料。僅本分頁有效，關閉分頁自動上鎖。</p>'
      + '<input type="password" id="sec-pass" placeholder="密碼" autocomplete="current-password">'
      + '<div class="sec-err" id="sec-err"></div>'
      + '<div class="sec-actions"><button type="button" class="sec-cancel">取消</button><button type="button" class="sec-ok">解鎖</button></div>'
      + '</div>';
    document.body.appendChild(box);
    const input = $("#sec-pass", box), err = $("#sec-err", box);
    input.focus();
    const tryUnlock = async () => {
      err.textContent = "";
      try {
        const data = await decryptBlob(TRIP_DATA.secure, input.value);
        SEC.data = data;
        try { sessionStorage.setItem(SS_KEY, JSON.stringify(data)); } catch (e) {}
        box.remove();
        refreshSecure();
      } catch (e) { err.textContent = "密碼錯誤，請再試一次"; input.select(); }
    };
    $(".sec-ok", box).addEventListener("click", tryUnlock);
    $(".sec-cancel", box).addEventListener("click", () => box.remove());
    input.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
    box.addEventListener("click", e => { if (e.target === box) box.remove(); });
  }

  const lockBtn = $("#lock-btn");
  if (lockBtn) lockBtn.addEventListener("click", () => {
    if (!TRIP_DATA.secure) return;
    if (SEC.data) {
      SEC.data = null;
      try { sessionStorage.removeItem(SS_KEY); } catch (e) {}
      refreshSecure();
    } else openSecModal();
  });
  document.addEventListener("click", e => {
    const t = e.target && e.target.closest ? e.target.closest(".sec-locked") : null;
    if (t && !t.classList.contains("unset")) openSecModal();
  });
  refreshSecure();

  /* ---------- Google 帳號登入：GIS 按鈕取得 ID token → 橋接 Firebase Auth ---------- */
  /* Firebase：動態 import CDN modular SDK（app/auth/firestore，不含 analytics）。
     載入失敗（斷網、舊瀏覽器）時 FB.failed=true，登入按鈕轉灰態，其餘頁面照常。 */
  const FB = { auth: null, authM: null, fs: null, db: null, user: null, ready: false, failed: false };
  const authProfile = () => FB.user
    ? { name: FB.user.displayName || FB.user.email || "旅伴", email: FB.user.email || "", picture: FB.user.photoURL || "" }
    : null;
  async function fbInit() {
    try {
      const V = "https://www.gstatic.com/firebasejs/12.17.0/";
      const [appM, authM, fsM] = await Promise.all([
        import(V + "firebase-app.js"),
        import(V + "firebase-auth.js"),
        import(V + "firebase-firestore.js")
      ]);
      const app = appM.initializeApp(TRIP_DATA.firebase);
      FB.authM = authM;
      FB.fs = fsM;
      FB.auth = authM.getAuth(app);
      try {
        FB.db = fsM.initializeFirestore(app, { localCache: fsM.persistentLocalCache() });
      } catch (e) {
        FB.db = fsM.getFirestore(app); // 無痕模式等 IndexedDB 不可用 → 退回記憶體快取
      }
      FB.ready = true;
      authM.onAuthStateChanged(FB.auth, u => {
        FB.user = u || null;
        refreshAuth();
        expWatch();
        prepWatch();
        memWatch();
        /* 自動收集旅伴頭像：登入即 upsert {email,name,picture} 到 meta/members（email 正規化為 key） */
        if (u && u.email) {
          const prof = {};
          prof[u.email.toLowerCase().replace(/[^a-z0-9]/g, "_")] = {
            email: u.email, name: u.displayName || u.email, picture: u.photoURL || "", ts: Date.now()
          };
          FB.fs.setDoc(FB.fs.doc(FB.db, "trips", TRIP_DATA.id, "meta", "members"),
            { profiles: prof }, { merge: true }).catch(e => {});
        }
        const box = $(".auth-modal");
        if (u && box) box.remove();
        if (u && authPendingCb) { const cb = authPendingCb; authPendingCb = null; cb(); }
      });
    } catch (e) {
      FB.failed = true;
      refreshAuth();
      refreshExpenses();
    }
  }
  /* 頭像 HTML：img 載入失敗時退回字母圓點 */
  const authAv = (p, cls) => {
    const letter = '<span class="' + cls + '">' + esc(String(p.name || "?").slice(0, 1).toUpperCase()) + '</span>';
    if (!p.picture) return letter;
    return '<img class="' + cls + '" src="' + esc(p.picture) + '" alt="" referrerpolicy="no-referrer"'
      + ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-flex\';">'
      + '<span class="' + cls + '" style="display:none;">' + esc(String(p.name || "?").slice(0, 1).toUpperCase()) + '</span>';
  };
  let gsiReady = false;
  let authPendingCb = null;
  /* GIS 回呼：拿 ID token 換 Firebase 憑證登入（之後由 onAuthStateChanged 驅動 UI） */
  async function onGoogleCred(resp) {
    if (!resp || !resp.credential) return;
    for (let i = 0; i < 50 && !FB.ready && !FB.failed; i++) await new Promise(r => setTimeout(r, 100));
    if (!FB.ready) return;
    try {
      const cred = FB.authM.GoogleAuthProvider.credential(resp.credential);
      await FB.authM.signInWithCredential(FB.auth, cred);
    } catch (e) {
      const box = $(".auth-modal .muted");
      if (box) box.textContent = "登入失敗：" + String(e && e.code || e) + "，請再試一次。";
    }
  }
  function gsiInit() {
    if (gsiReady || !TRIP_DATA.googleClientId) return gsiReady;
    if (!(window.google && google.accounts && google.accounts.id)) return false;
    google.accounts.id.initialize({ client_id: TRIP_DATA.googleClientId, callback: onGoogleCred });
    gsiReady = true;
    return true;
  }
  function openAuthModal(cb) {
    if ($(".auth-modal")) return;
    authPendingCb = cb || null;
    const box = document.createElement("div");
    box.className = "sec-modal auth-modal";
    const body = TRIP_DATA.googleClientId
      ? (gsiInit()
        ? '<p class="muted">使用 Google 帳號登入：僅作為記帳署名與頭像顯示，不會存取你的其他資料。</p><div class="gsi-host" id="gsi-host"></div>'
        : '<p class="muted">Google 登入元件載入中或被瀏覽器阻擋，請稍後再試。</p>')
      : '<p class="muted">Google 登入尚未設定：請先在 TRIP_DATA.googleClientId 填入 OAuth Client ID。</p>';
    box.innerHTML = '<div class="sec-card"><h4>' + ic("user", "sm") + ' 使用 Google 登入</h4>'
      + body + '<div class="sec-actions"><button type="button" class="sec-cancel">取消</button></div></div>';
    document.body.appendChild(box);
    if (TRIP_DATA.googleClientId && gsiReady) {
      google.accounts.id.renderButton($("#gsi-host", box), { theme: "outline", size: "large", text: "signin_with", shape: "pill" });
    }
    box.addEventListener("click", e => {
      if (e.target === box || e.target.closest(".sec-cancel")) { authPendingCb = null; box.remove(); }
    });
  }
  function authLogout() {
    if (gsiReady) { try { google.accounts.id.disableAutoSelect(); } catch (e) {} }
    if (FB.ready) { try { FB.authM.signOut(FB.auth); } catch (e) {} } // onAuthStateChanged 會刷新 UI
  }
  function refreshAuth() {
    const btn = $("#auth-btn");
    if (!btn) return;
    const p = authProfile();
    if (p) {
      btn.classList.remove("auth-off");
      btn.innerHTML = authAv(p, "auth-av") + esc(p.name) + '・登出';
      btn.title = esc(p.email);
    } else if (FB.failed) {
      btn.classList.add("auth-off");
      btn.innerHTML = ic("user", "sm") + ' 登入服務載入失敗';
      btn.title = "";
    } else if (!TRIP_DATA.googleClientId) {
      btn.classList.add("auth-off");
      btn.innerHTML = ic("user", "sm") + ' Google 登入尚未設定';
      btn.title = "";
    } else {
      btn.classList.remove("auth-off");
      btn.innerHTML = ic("user", "sm") + ' 使用 Google 登入';
      btn.title = "";
    }
  }
  const authBtn = $("#auth-btn");
  if (authBtn) authBtn.addEventListener("click", () => {
    if (authProfile()) { authLogout(); return; }
    openAuthModal();
  });
  refreshAuth();
  fbInit();

  /* ---------- Lightbox：點 .lb 圖片全螢幕放大，再點關閉 ---------- */
  document.addEventListener("click", e => {
    const t = e.target;
    if (!t || !t.classList || !t.classList.contains("lb")) return;
    const box = document.createElement("div");
    box.className = "lightbox";
    box.innerHTML = '<span class="lb-close" aria-hidden="true">×</span>';
    const im = document.createElement("img");
    im.src = t.src;
    im.alt = t.alt || "";
    box.appendChild(im);
    box.addEventListener("click", () => box.remove());
    document.body.appendChild(box);
  });

  /* ==================== 2. 行前準備 ==================== */
  /* ---------- 行前準備：Firestore 共用（trips/{id}/meta/prep）＋打勾沉底＋自訂提醒 ---------- */
  const PREP = {
    checked: {},   // { itemId: true/false } 旅伴共用勾選狀態
    custom: [],    // 自訂提醒 [{id,name,category,note,deadline}]
    loaded: false, unsub: null,
    mergedKey: "trip::" + TRIP_DATA.id + "::prep-ls-merged" // 此裝置舊 localStorage 勾選已合併過的標記
  };
  const prepRef = () => FB.fs.doc(FB.db, "trips", TRIP_DATA.id, "meta", "prep");
  /* 預設 13 項由 TRIP_DATA 種子化；id 固定為 d{分類序}-{項目序} */
  const prepDefaults = () => {
    const out = [];
    TRIP_DATA.prep.forEach((cat, ci) => cat.items.forEach((it, ii) => out.push({
      id: "d" + ci + "-" + ii, category: cat.category,
      name: it.name, note: it.note || "", deadline: it.deadline || "",
      isDefault: true, lsKey: "trip::" + TRIP_DATA.id + "::prep::" + ci + "::" + ii
    })));
    return out;
  };
  function prepWatch() {
    if (PREP.unsub) { PREP.unsub(); PREP.unsub = null; }
    PREP.checked = {}; PREP.custom = []; PREP.loaded = false;
    if (!FB.user) { renderPrepList(); return; }
    PREP.unsub = FB.fs.onSnapshot(prepRef(), s => {
      const dd = s.data() || {};
      PREP.checked = dd.checked || {};
      PREP.custom = Array.isArray(dd.custom) ? dd.custom : [];
      PREP.loaded = true;
      prepMergeLS();
      renderPrepList();
    }, () => { PREP.loaded = true; renderPrepList(); });
  }
  /* 一次性：首次登入時把此裝置的舊 localStorage 勾選合併進 Firestore */
  function prepMergeLS() {
    try {
      if (localStorage.getItem(PREP.mergedKey) === "1") return;
      localStorage.setItem(PREP.mergedKey, "1");
      const upd = {};
      prepDefaults().forEach(it => {
        if (localStorage.getItem(it.lsKey) === "1" && !PREP.checked[it.id]) upd[it.id] = true;
      });
      if (Object.keys(upd).length)
        FB.fs.setDoc(prepRef(), { checked: upd }, { merge: true }).catch(e => {});
    } catch (e) { /* 私密模式 */ }
  }
  function prepToggle(id, val) {
    if (!FB.ready || !FB.user) return;
    const upd = {}; upd[id] = !!val;
    FB.fs.setDoc(prepRef(), { checked: upd }, { merge: true }).catch(e => {});
  }
  function prepAddItem(item) {
    if (!FB.ready || !FB.user) return;
    FB.fs.setDoc(prepRef(), { custom: FB.fs.arrayUnion(item) }, { merge: true }).catch(e => {});
  }
  function prepDelItem(id) {
    if (!FB.ready || !FB.user) return;
    const upd = {}; upd[id] = false;
    FB.fs.setDoc(prepRef(), { custom: PREP.custom.filter(x => x.id !== id), checked: upd }, { merge: true }).catch(e => {});
  }
  function renderPrepList() {
    const list = $("#prep-list");
    if (!list) return;
    const ro = !FB.user; // 未登入唯讀：顯示預設項目與此裝置舊勾選，不可操作
    const lsChecked = it => { try { return localStorage.getItem(it.lsKey) === "1"; } catch (e) { return false; } };
    const items = prepDefaults().concat(PREP.custom.map(c => Object.assign({ isDefault: false }, c)))
      .map(it => Object.assign({}, it, { done: ro ? (it.isDefault && lsChecked(it)) : !!PREP.checked[it.id] }));
    const fmtDl = d => /^\d{4}-\d{2}-\d{2}$/.test(d) ? fmtDate(d) : esc(d);
    const itemHTML = it => '<label class="prep-item' + (it.done ? ' done' : '') + '" data-id="' + esc(it.id) + '">'
      + '<input type="checkbox"' + (it.done ? ' checked' : '') + (ro ? ' disabled' : '') + '>'
      + '<span class="txt"><span class="name">' + esc(it.name) + '</span>'
      + (it.deadline ? '<span class="deadline">截止 ' + fmtDl(it.deadline) + '</span>' : '')
      + (it.note ? '<br><span class="muted">' + esc(it.note) + '</span>' : '')
      + '</span>'
      + (!it.isDefault && !ro ? '<button type="button" class="row-act del prep-del" data-del="' + esc(it.id) + '" title="刪除自訂提醒">' + ic("trash", "sm") + '</button>' : '')
      + '</label>';

    let html = "";
    TRIP_DATA.prep.forEach((cat, ci) => {
      const group = items.filter(it => !it.done && it.category === cat.category);
      if (!group.length) return;
      html += '<div class="prep-cat c' + (ci % 4) + '"><h4>' + ic(catIcon(cat.category), "sm") + '<span class="no">(' + pad2(ci + 1) + ')</span>' + esc(cat.category) + '</h4>'
        + group.map(itemHTML).join('') + '</div>';
    });
    const doneItems = items.filter(it => it.done);
    if (doneItems.length) {
      html += '<div class="prep-cat prep-done-sec"><h4>' + ic("check", "sm ic-sage") + '已完成 ✓（' + doneItems.length + '）</h4>'
        + doneItems.map(itemHTML).join('') + '</div>';
    }
    list.innerHTML = html || '<p class="muted">尚無項目</p>';

    const done = doneItems.length, total = items.length;
    const cnt = $("#prep-count"), bar = $("#prep-bar"), hint = $("#prep-hint");
    if (cnt) cnt.textContent = done + "/" + total + " 已完成";
    if (bar) bar.style.width = (total ? Math.round(done / total * 100) : 0) + "%";
    if (hint) hint.textContent = ro
      ? "唯讀預覽：登入後可勾選與新增提醒，進度與旅伴即時同步"
      : (PREP.loaded ? "勾選進度與旅伴即時同步；打勾的項目會移到最下方" : "同步載入中…");
  }

  (function initPrep() {
    const p = panel("prep");
    const cats = TRIP_DATA.prep.map(c => c.category);
    p.innerHTML = '<div class="card"><h3>' + secTitle("01", "行前準備清單", "Checklist", "checksq") + '</h3>'
      + '<div class="progress-wrap"><div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px;">'
      + '<span class="muted" style="letter-spacing:.2em;">PROGRESS</span><b id="prep-count" style="font-weight:500;"></b></div>'
      + '<div class="progress-bar"><div id="prep-bar" style="width:0%"></div></div></div>'
      + '<div class="prep-hint" id="prep-hint"></div>'
      + '<div style="margin:12px 0 4px;"><button type="button" class="ef-cancel" id="prep-add-btn">＋ 新增提醒</button></div>'
      + '<form class="prep-add-form" id="prep-add-form" hidden><div class="ef-grid">'
      + '<div class="ef-f ef-name"><label>提醒事項</label><input name="pname" required autocomplete="off"></div>'
      + '<div class="ef-f"><label>分類</label><select name="pcat">' + cats.map(c => '<option>' + esc(c) + '</option>').join('') + '</select></div>'
      + '<div class="ef-f"><label>截止日（選填）</label><input name="pdl" placeholder="2027-01-30" autocomplete="off"></div>'
      + '<div class="ef-f ef-note"><label>備註（選填）</label><input name="pnote" autocomplete="off"></div>'
      + '</div><div class="ef-actions">'
      + '<button type="button" class="ef-cancel" id="prep-add-cancel">取消</button>'
      + '<button type="submit" class="ef-submit">加入清單</button>'
      + '</div></form>'
      + '<div id="prep-list"></div></div>';

    const form = $("#prep-add-form", p);
    $("#prep-add-btn", p).addEventListener("click", () => {
      if (!authProfile()) { openAuthModal(); return; }
      form.hidden = !form.hidden;
      if (!form.hidden) form.elements.pname.focus();
    });
    $("#prep-add-cancel", p).addEventListener("click", () => { form.reset(); form.hidden = true; });
    form.addEventListener("submit", e => {
      e.preventDefault();
      const name = form.elements.pname.value.trim();
      if (!name) return;
      prepAddItem({
        id: newId(), name: name,
        category: form.elements.pcat.value,
        note: form.elements.pnote.value.trim(),
        deadline: form.elements.pdl.value.trim()
      });
      form.reset(); form.hidden = true;
    });

    $("#prep-list", p).addEventListener("click", e => {
      const del = e.target.closest(".prep-del");
      if (del) {
        e.preventDefault();
        const it = PREP.custom.find(x => x.id === del.dataset.del);
        if (it && confirm("刪除自訂提醒「" + it.name + "」？")) prepDelItem(it.id);
      }
    });
    $("#prep-list", p).addEventListener("change", e => {
      const cb = e.target;
      if (!cb || cb.type !== "checkbox") return;
      const lb = cb.closest(".prep-item");
      if (!lb) return;
      lb.classList.add("moving"); // 淡出過渡，snapshot 重繪後在新位置以動畫進場
      prepToggle(lb.dataset.id, cb.checked);
    });
    renderPrepList();
  })();

  /* ==================== 3. 每日行程 ==================== */
  /* ---------- 每日小地圖：Leaflet ＋ CARTO Positron 淺色底圖 ----------
     切到該天頁籤才初始化（lazy、一次 init 後保留），避免載入頁面就抓全部圖磚；
     Leaflet CDN 載入失敗（斷網）→ 降級成「今日活動區域」文字卡，不破版。 */
  const DAY_MAPS = {}, MAP_TRIES = {};
  let BOUNDARY_BB = null; // 城界 bbox 快取（fitBounds 出城判斷用）
  function boundaryBB() {
    if (BOUNDARY_BB !== null || !TRIP_DATA.cityBoundary || !(window.L && L.latLngBounds)) return BOUNDARY_BB;
    const arr = [];
    (function walk(c) { typeof c[0] === "number" ? arr.push([c[1], c[0]]) : c.forEach(walk); })(TRIP_DATA.cityBoundary.coordinates);
    BOUNDARY_BB = L.latLngBounds(arr);
    return BOUNDARY_BB;
  }
  const dayZone = day => String(day.theme || "").split("（")[0];
  const dayMapHTML = (di, day) =>
    '<div class="day-map-wrap"><div class="day-map" id="day-map-' + di + '"></div>'
    + '<span class="day-map-label">' + esc(dayZone(day)) + '</span></div>';
  function dayMapFallback(el, di, zone) {
    DAY_MAPS[di] = "fallback";
    el.classList.add("day-map-fallback");
    el.innerHTML = ic("map", "sm") + ' 今日活動區域：<b>' + esc(zone) + '</b>　'
      + '<span class="muted">（離線或地圖元件未載入，改以文字顯示）</span>';
    const lb = el.parentElement.querySelector(".day-map-label");
    if (lb) lb.remove();
  }
  function initDayMap(di) {
    const day = TRIP_DATA.days[di];
    const el = document.getElementById("day-map-" + di);
    if (!el || DAY_MAPS[di] || !day) return;
    const zone = dayZone(day);
    const pts = (day.spots || [])
      .map((s, i) => ({ name: s.name, coords: s.coords, base: s.base, no: i + 1 }))
      .filter(x => Array.isArray(x.coords) && x.coords.length === 2);
    if (!pts.length) { dayMapFallback(el, di, zone); return; }
    if (!(window.L && L.map)) {
      /* Leaflet 以 defer 載入，可能還沒好：短暫重試幾次，仍失敗才降級 */
      MAP_TRIES[di] = (MAP_TRIES[di] || 0) + 1;
      if (MAP_TRIES[di] <= 6) setTimeout(() => { if (!DAY_MAPS[di]) initDayMap(di); }, 500);
      else dayMapFallback(el, di, zone);
      return;
    }
    const map = L.map(el, { scrollWheelZoom: false, zoomControl: false });
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
    }).addTo(map);
    /* 城市邊界描邊：主色 75% 透明、2px 虛線（內嵌簡化 GeoJSON，不外抓） */
    if (TRIP_DATA.cityBoundary) {
      const mainCol = (getComputedStyle(document.documentElement).getPropertyValue("--blue") || "#767676").trim();
      L.geoJSON(TRIP_DATA.cityBoundary, {
        interactive: false,
        style: { color: mainCol, opacity: .75, weight: 2, dashArray: "6 6", fill: false }
      }).addTo(map);
    }
    /* marker：一般＝主色編號圓點；base 點照常顯示但不參與 fitBounds
       （飯店＝陶土色小家、機場＝芥末金小飛機、交通出發點＝小空心點） */
    const dotIcon = x => {
      if (!x.base) return L.divIcon({ className: "map-dot-wrap", html: '<div class="map-dot">' + x.no + '</div>', iconSize: [26, 26], iconAnchor: [13, 13] });
      const t = x.base === "hotel" ? " map-dot-hotel" : x.base === "airport" ? " map-dot-air" : " map-dot-base";
      const inner = x.base === "hotel" ? ic("home", "sm") : x.base === "airport" ? ic("plane", "sm") : "";
      const size = inner ? 22 : 12;
      return L.divIcon({ className: "map-dot-wrap", html: '<div class="map-dot map-dot-b' + t + '">' + inner + '</div>', iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
    };
    pts.forEach(x => { L.marker(x.coords, { icon: dotIcon(x) }).addTo(map).bindPopup(esc(x.name)); });
    const focus = pts.filter(x => !x.base);
    let fit = L.latLngBounds((focus.length ? focus : pts).map(x => x.coords));
    /* 出城日：聚焦點跑出城界時，把城界一起框進來，看得出「今天跑出框外」 */
    const bb = boundaryBB();
    if (bb && focus.length && focus.some(x => !bb.contains(L.latLng(x.coords)))) fit = fit.extend(bb);
    map.fitBounds(fit, { padding: [34, 34], maxZoom: 15 });
    DAY_MAPS[di] = map;
  }

  function flowHTML(day) {
    let h = '<div class="flow-scroll"><div class="flow">';
    day.spots.forEach((s, i) => {
      if (i > 0) h += '<div class="flow-link"></div>';
      h += '<div class="flow-node"><div class="dot">' + (i + 1) + '</div>'
        + '<div class="nm">' + esc(s.name) + '</div>'
        + '<div class="st">' + esc(s.stay) + '</div></div>';
    });
    return h + '</div></div>';
  }

  function carouselHTML(imgs, alt) {
    let h = '<div class="carousel"><div class="car-track">';
    imgs.forEach(u => {
      h += '<img src="' + esc(u) + '" alt="' + esc(alt) + '" loading="lazy" '
        + 'onerror="this.onerror=null;this.src=phFallback(this.alt);">';
    });
    h += '</div>';
    if (imgs.length > 1) {
      h += '<button class="car-btn prev" type="button" aria-label="上一張">‹</button>'
        + '<button class="car-btn next" type="button" aria-label="下一張">›</button>'
        + '<div class="car-dots">' + imgs.map((_, i) => '<span' + (i === 0 ? ' class="on"' : '') + '></span>').join('') + '</div>';
    }
    return h + '</div>';
  }

  function initCarousels(scope) {
    $$(".carousel", scope).forEach(c => {
      const track = $(".car-track", c), dots = $$(".car-dots span", c);
      if (!dots.length) return;
      const idx = () => Math.round(track.scrollLeft / track.clientWidth);
      const go = i => track.scrollTo({ left: i * track.clientWidth, behavior: "smooth" });
      $(".car-btn.prev", c).addEventListener("click", () => go(Math.max(0, idx() - 1)));
      $(".car-btn.next", c).addEventListener("click", () => go(Math.min(dots.length - 1, idx() + 1)));
      track.addEventListener("scroll", () => {
        const i = idx();
        dots.forEach((d, j) => d.classList.toggle("on", j === i));
      }, { passive: true });
    });
  }

  TRIP_DATA.days.forEach((day, di) => {
    const p = panel("day" + di);
    let html = '<div class="card"><h3>' + secTitle("Route", "今日節點圖", "", "map")
      + '<span class="en">' + fmtDate(day.date) + (day.theme ? '｜' + esc(day.theme) : '') + '</span></h3>'
      + flowHTML(day) + dayMapHTML(di, day) + '</div>';

    day.spots.forEach((s, si) => {

  /* ==================== 4. 記帳（Firebase Firestore：onSnapshot 即時同步＋內建離線持久化） ==================== */
  const EXP = {
    list: [],            // 目前快照（含本機樂觀更新）
    pendingIds: new Set(), // 尚未寫進伺服器的 doc id
    loaded: false, error: "", unsub: null, unsubCfg: null,
    customCats: [],      // 自訂分類（Firestore trips/{id}/meta/config.categories，旅伴共用）
    migratable: null     // null=尚未檢查；[]=無可匯入；[...]=可一鍵匯入的內嵌初始記錄
  };
  /* 預設分類固定不可刪；自訂分類接在後面，最後永遠是「＋新增分類」 */
  const CATS_DEFAULT = ["事前"].concat(TRIP_DATA.days.map((d, i) => "第" + (i + 1) + "天")).concat(["其他"]);
  function rebuildCats() {
    const f = $("#exp-form");
    if (!f) return;
    const sel = f.elements.category;
    const cur = sel.value;
    const all = CATS_DEFAULT.concat(EXP.customCats.filter(c => CATS_DEFAULT.indexOf(c) < 0));
    sel.innerHTML = all.map(c => '<option>' + esc(c) + '</option>').join('')
      + '<option value="__add__">＋新增分類</option>';
    if (cur && all.indexOf(cur) >= 0) sel.value = cur;
  }
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  /* ---------- 匯率 THB↔TWD：open.er-api.com 主源＋jsDelivr(fawazahmed0) 備援 ---------- */
  const FX = { rate: null, date: "", offline: false, K: "trip::" + TRIP_DATA.id + "::fxcache" };
  const fxShortDate = d => { const m = String(d).match(/(\d{4})-(\d{2})-(\d{2})/); return m ? (+m[2]) + "/" + (+m[3]) : String(d); };
  function fxNote() {
    const el = $("#fx-note");
    if (!el) return;
    if (!FX.rate) el.textContent = "目前取不到匯率——兩邊金額請手動輸入";
    else el.textContent = (FX.offline ? "離線匯率（" + fxShortDate(FX.date) + "）" : "匯率（" + fxShortDate(FX.date) + "）")
      + "：1 THB ≈ " + FX.rate.toFixed(2) + " TWD。輸入任一欄自動換算，另一欄可手動微調。";
  }
  async function fxLoad() {
    const cached = lsGet(FX.K, null);
    if (cached && cached.rate) { FX.rate = cached.rate; FX.date = cached.date; FX.offline = true; }
    const sources = [
      { url: "https://open.er-api.com/v6/latest/THB",
        pick: j => ({ rate: j && j.rates && j.rates.TWD,
                      date: j && j.time_last_update_unix ? new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10) : "" }) },
      { url: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/thb.json",
        pick: j => ({ rate: j && j.thb && j.thb.twd, date: (j && j.date) || "" }) }
    ];
    for (const s of sources) {
      try {
        const r = await fetch(s.url, { cache: "no-store" });
        if (!r.ok) continue;
        const v = s.pick(await r.json());
        if (v.rate && isFinite(v.rate)) {
          FX.rate = +v.rate;
          FX.date = v.date || new Date().toISOString().slice(0, 10);
          FX.offline = false;
          lsSet(FX.K, { rate: FX.rate, date: FX.date, ts: Date.now() });
          break;
        }
      } catch (e) { /* 換下一個來源 */ }
    }
    fxNote();
    refreshExpenses();
  }

  /* 舊格式（單幣 {amount,currency}）自動遷移為雙幣顯示 */
  function expNorm(e) {
    if (e.amountTHB != null || e.amountTWD != null) return e;
    const n = Object.assign({}, e);
    if ((e.currency || "THB") === "TWD") {
      n.amountTWD = e.amount;
      n.amountTHB = FX.rate ? Math.round(e.amount / FX.rate) : null;
    } else {
      n.amountTHB = e.amount;
      n.amountTWD = FX.rate ? Math.round(e.amount * FX.rate) : null;
    }
    n.inputCurrency = e.currency || "THB";
    n.rate = FX.rate || null;
    n.rateDate = FX.rate ? FX.date + "（自動補算）" : null;
    return n;
  }
  const newId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
  const expList = () => EXP.list;
  const expDocRef = id => FB.fs.doc(FB.db, "trips", TRIP_DATA.id, "expenses", id);

  /* 登入後掛 onSnapshot 即時監聽（含離線快取與樂觀更新）；登出即拆除並清畫面 */
  function expWatch() {
    if (EXP.unsub) { EXP.unsub(); EXP.unsub = null; }
    if (EXP.unsubCfg) { EXP.unsubCfg(); EXP.unsubCfg = null; }
    EXP.list = []; EXP.pendingIds = new Set(); EXP.loaded = false; EXP.error = ""; EXP.migratable = null;
    EXP.customCats = [];
    rebuildCats();
    if (!FB.user) { refreshExpenses(); return; }
    /* 自訂分類：共用設定文件即時同步（規則未開放 meta 路徑時靜默略過） */
    EXP.unsubCfg = FB.fs.onSnapshot(
      FB.fs.doc(FB.db, "trips", TRIP_DATA.id, "meta", "config"),
      s => {
        const dd = s.data();
        EXP.customCats = (dd && Array.isArray(dd.categories)) ? dd.categories.filter(x => typeof x === "string" && x.trim()) : [];
        rebuildCats();
      },
      () => {}
    );
    EXP.unsub = FB.fs.onSnapshot(
      FB.fs.collection(FB.db, "trips", TRIP_DATA.id, "expenses"),
      { includeMetadataChanges: true },
      snap => {
        EXP.list = snap.docs.map(d => d.data())
          .sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
        EXP.pendingIds = new Set(snap.docs.filter(d => d.metadata.hasPendingWrites).map(d => d.id));
        EXP.loaded = true; EXP.error = "";
        if (!snap.size && EXP.migratable === null) expCheckMigrate();
        refreshExpenses();
      },
      err => { EXP.error = String(err && err.code || err); EXP.loaded = true; refreshExpenses(); }
    );
  }

  /* Firestore 為空時提供內嵌初始資料（TRIP_DATA.seedExpenses）一鍵匯入 */
  async function expCheckMigrate() {
    EXP.migratable = Array.isArray(TRIP_DATA.seedExpenses) ? TRIP_DATA.seedExpenses.slice() : [];
    refreshExpenses();
  }
  async function expMigrate() {
    if (!FB.user || !EXP.migratable || !EXP.migratable.length) return;
    try {
      const batch = FB.fs.writeBatch(FB.db);
      EXP.migratable.forEach(e => {
        const id = e.id || newId();
        batch.set(expDocRef(id), Object.assign({}, e, { id: id }));
      });
      EXP.migratable = [];
      refreshExpenses();
      await batch.commit();
    } catch (e) { EXP.error = "匯入失敗：" + String(e && e.code || e); refreshExpenses(); }
  }

  /* 寫入/刪除：不 await 伺服器回應（離線時由本機快取樂觀更新，回線自動送出） */
  function expUpsert(item) {
    if (!FB.ready || !FB.user) return;
    FB.fs.setDoc(expDocRef(item.id), item).catch(e => { EXP.error = String(e && e.code || e); refreshExpenses(); });
  }
  function expDelete(id) {
    if (!FB.ready || !FB.user) return;
    FB.fs.deleteDoc(expDocRef(id)).catch(e => { EXP.error = String(e && e.code || e); refreshExpenses(); });
  }

  function refreshExpenses() {
    const stats = $("#exp-stats"), table = $("#exp-table");
    if (!stats || !table) return;
    const badge = $("#exp-sync-badge");

    /* 未登入：不顯示資料（Firestore 規則也會擋），提示先登入 */
    if (!FB.user) {
      stats.innerHTML = "";
      table.innerHTML = '<div class="muted" style="text-align:center;padding:34px 12px;">'
        + ic("user", "sm") + ' 登入後可記帳與查看</div>';
      if (badge) badge.innerHTML = ic("key", "sm") + (FB.failed ? ' 登入服務載入失敗' : ' 未登入');
      return;
    }
    const list = expList().map(expNorm);
    const queuedIds = EXP.pendingIds;

    const addTo = (map, key, cur, amt) => {
      if (amt == null || isNaN(amt)) return;
      if (!map[key]) map[key] = {};
      map[key][cur] = (map[key][cur] || 0) + amt;
    };
    const moneyStr = obj => Object.entries(obj).map(([c, a]) => c + " " + fmtMoney(c === "THB" || c === "TWD" ? Math.round(a) : +a.toFixed(2))).join("　·　") || "—";
    const totals = {}, byPayer = {}, byCat = {};
    list.forEach(e => {
      if (e.status === "已退款") return;
      addTo(totals, "t", "THB", e.amountTHB); addTo(totals, "t", "TWD", e.amountTWD);
      addTo(byPayer, e.payer || "未填", "THB", e.amountTHB); addTo(byPayer, e.payer || "未填", "TWD", e.amountTWD);
      addTo(byCat, e.category || "其他", "THB", e.amountTHB); addTo(byCat, e.category || "其他", "TWD", e.amountTWD);
    });
    stats.innerHTML =
      '<div class="stat-card"><div class="t">' + ic("wallet", "sm ic-blue") + '總花費（不含已退款）</div><div class="big">' + moneyStr(totals.t || {}) + '</div></div>'
      + '<div class="stat-card"><div class="t">' + ic("user", "sm ic-terra") + '依「誰付的」小計</div>'
      + (Object.keys(byPayer).length
        ? Object.entries(byPayer).map(([k, v]) => '<div class="row"><span>' + esc(k) + '</span><b>' + moneyStr(v) + '</b></div>').join('')
        : '<div class="muted">尚無資料</div>')
      + '</div>'
      + '<div class="stat-card"><div class="t">' + ic("tag", "sm ic-sage") + '依分類小計</div>'
      + (Object.keys(byCat).length
        ? Object.entries(byCat).map(([k, v]) => '<div class="row"><span>' + esc(k) + '</span><b>' + moneyStr(v) + '</b></div>').join('')
        : '<div class="muted">尚無資料</div>')
      + '</div>';

    const badgeCls = s => s === "已付款" ? "paid" : s === "待付款" ? "pending" : s === "已退款" ? "refund" : "other";
    let rows = "", cards = "";
    list.forEach(e => {
      /* 記錄者頭像：新格式 recordedBy={name,email,picture}；舊字串格式僅取名字 */
      const rb = e.recordedBy;
      const rec = rb ? (typeof rb === "object" ? rb : { name: String(rb) }) : null;
      const recAv = rec && rec.name
        ? '<span title="記錄：' + esc(rec.name) + (rec.email ? "（" + esc(rec.email) + "）" : "") + '">' + authAv(rec, "rec-av") + '</span>'

      const pend = queuedIds.has(e.id) ? ' <span class="exp-pending">●未同步</span>' : '';
      const actBtns = '<button type="button" class="row-act" data-edit="' + esc(e.id) + '" title="編輯">' + ic("edit", "sm") + '</button>'
        + '<button type="button" class="row-act del" data-del="' + esc(e.id) + '" title="刪除">' + ic("trash", "sm") + '</button>';
      rows += '<tr><td>' + esc(e.name) + pend + '</td>'
        + '<td class="amt">' + (e.amountTHB != null ? "THB " + fmtMoney(e.amountTHB) : '<span class="muted">—</span>')
        + '<br><span class="muted">' + (e.amountTWD != null ? "TWD " + fmtMoney(e.amountTWD) : "—") + '</span></td>'
        + '<td><span class="badge ' + badgeCls(e.status) + '">' + esc(e.status) + '</span></td>'
        + '<td><span class="chip">' + esc(e.category) + '</span></td>'
        + '<td>' + (recAv || ic("user", "sm ic-terra") + ' ') + esc(e.payer) + '</td>'
        + '<td class="muted">' + esc(e.note) + '</td>'
        + '<td class="acts">' + actBtns + '</td></tr>';
      /* 手機卡片：項目＋分類 / 雙幣金額 / 付款人・狀態・日期 */
      const dm = String(e.createdAt || "").match(/^\d{4}-(\d{2})-(\d{2})/);
      const dstr = dm ? (+dm[1]) + "/" + (+dm[2]) : "";
      cards += '<div class="exp-card">'
        + '<div class="xc-acts">' + actBtns + '</div>'
        + '<div class="xc-head"><span class="xc-name">' + esc(e.name) + '</span><span class="chip">' + esc(e.category) + '</span></div>'
        + '<div class="xc-amt">' + (e.amountTHB != null ? "THB " + fmtMoney(e.amountTHB) : '<span class="muted">THB —</span>')
        + '<span class="sub">TWD ' + (e.amountTWD != null ? fmtMoney(e.amountTWD) : "—") + '</span></div>'
        + '<div class="xc-meta">' + (recAv || ic("user", "sm ic-terra") + ' ') + '<span>' + esc(e.payer) + '</span>'
        + '<span class="badge ' + badgeCls(e.status) + '">' + esc(e.status) + '</span>'
        + (dstr ? '<span>' + dstr + '</span>' : '')
        + (e.note ? '<span>' + esc(e.note) + '</span>' : '') + pend + '</div>'
        + '</div>';
    });
    /* 一次性匯入：Firestore 為空且有內嵌初始資料 → 提供匯入按鈕 */

      ? '<div style="text-align:center;padding:16px 0 6px;">'
        + '<button type="button" class="ef-submit" id="exp-migrate">匯入初始資料（' + EXP.migratable.length + ' 筆）</button>'
        + '<p class="muted" style="margin-top:8px;">把內建的初始記錄（機加酒）一次寫入雲端資料庫</p></div>'
      : '';
    const emptyMsg = EXP.loaded ? "尚無記帳資料，用上方表單記第一筆吧！" : "載入中…";
    table.innerHTML = migBar
      + '<div class="table-wrap"><table class="expense"><thead><tr>'
      + '<th>項目名稱</th><th>金額</th><th>Status</th><th>分類</th><th>誰付的</th><th>備註</th><th></th>'
      + '</tr></thead><tbody>'
      + (rows || '<tr><td colspan="7" class="muted" style="text-align:center;padding:26px;white-space:normal;">' + emptyMsg + '</td></tr>')
      + '</tbody></table></div>'
      + '<div class="exp-cards">'
      + (cards || '<div class="muted" style="text-align:center;padding:20px 8px;">' + emptyMsg + '</div>')
      + '</div>'
      + '<p class="muted" style="margin-top:10px;">＊「已退款」不計入統計。</p>';

    if (badge) {
      if (EXP.error) badge.innerHTML = ic("alert", "sm ic-terra") + ' ' + esc(EXP.error);
      else if (queuedIds.size) badge.innerHTML = ic("sync", "sm") + ' ' + queuedIds.size + ' 筆待同步（回線自動送出）';
      else if (EXP.loaded) badge.innerHTML = ic("check", "sm ic-sage") + ' 雲端即時同步';
      else badge.innerHTML = ic("sync", "sm") + ' 連線中…';
    }
    const off = $("#exp-offline");
    if (off) off.textContent = "";
  }

  (function renderMoney() {

      + '<div id="exp-stats" class="stats"></div><div id="exp-table"></div></div>';

    const form = $("#exp-form", p);
    const fe = n => form.elements[n];
    let editingId = null;
    rebuildCats();
    /* 「＋新增分類」：輸入即用並寫入共用設定（arrayUnion 併發安全），未登入先登入 */

    });
    const resetForm = () => {
      editingId = null; form.reset();
      touched.THB = touched.TWD = false; lastInput = "THB";
      rebuildCats(); // form.reset 後回到第一個分類，並清掉可能殘留的 __add__ 選取
      lastCat = fe("category").value;
      $("#exp-submit", p).textContent = "新增";
      $("#exp-cancel", p).style.display = "none";
    };
    const doSubmit = () => {
      const prev = editingId ? expNorm(expList().find(x => x.id === editingId) || {}) : null;
      const thb = parseFloat(fe("amountTHB").value);
      const twd = parseFloat(fe("amountTWD").value);
      const name = fe("name").value.trim();
      if (!name || (isNaN(thb) && isNaN(twd))) return;
      const u = authProfile();
      const item = {
        id: editingId || newId(),
        name: name,
        amountTHB: isNaN(thb) ? null : Math.round(thb),
        amountTWD: isNaN(twd) ? null : Math.round(twd),
        inputCurrency: lastInput,
        rate: FX.rate || null,
        rateDate: FX.rate ? FX.date : null,
        /* 舊欄位相容 */
        amount: lastInput === "TWD" ? (isNaN(twd) ? null : Math.round(twd)) : (isNaN(thb) ? null : Math.round(thb)),
        currency: lastInput,
        status: fe("status").value,
        category: fe("category").value === "__add__" ? lastCat : fe("category").value,
        /* 誰付的＝登入者；編輯既有記錄時保留原付款人 */
        payer: prev ? (prev.payer || (u ? u.name : "")) : (u ? u.name : ""),
        note: fe("note").value.trim(),
        recordedBy: u ? { name: u.name, email: u.email, picture: u.picture || "" } : null,
        createdAt: (prev && prev.createdAt) || new Date().toISOString()
      };
      resetForm();
      expUpsert(item);
    };
    form.addEventListener("submit", e => {
      e.preventDefault();
      /* 記帳一律需登入（Firestore 規則也要求 request.auth），登入成功後自動送出 */
      if (!authProfile()) { openAuthModal(doSubmit); return; }
      doSubmit();
    });
    $("#exp-cancel", p).addEventListener("click", resetForm);

    $("#exp-table", p).addEventListener("click", e => {
      const eb = e.target.closest("[data-edit]"), db = e.target.closest("[data-del]");
      if (e.target.closest("#exp-migrate")) { expMigrate(); return; }
      if (eb) {
        const raw = expList().find(x => x.id === eb.dataset.edit);
        if (!raw) return;
        const item = expNorm(raw);
        editingId = item.id;
        touched.THB = touched.TWD = false;
        lastInput = item.inputCurrency || "THB";
        fe("name").value = item.name;
        fe("amountTHB").value = item.amountTHB != null ? item.amountTHB : "";
        fe("amountTWD").value = item.amountTWD != null ? item.amountTWD : "";
        fe("status").value = item.status;
        rebuildCats();
        if (item.category && !Array.from(fe("category").options).some(o => o.value === item.category)) {
          /* 舊記錄的分類已不在清單（例如自訂分類被移除）→ 臨時補一個選項讓編輯不跳類 */
          const o = document.createElement("option"); o.textContent = item.category;
          fe("category").insertBefore ? fe("category").insertBefore(o, fe("category").lastElementChild) : fe("category").appendChild(o);
        }
        fe("category").value = item.category; lastCat = item.category;
        fe("note").value = item.note;
        $("#exp-submit", p).textContent = "更新";
        $("#exp-cancel", p).style.display = "";
        if (form.scrollIntoView) form.scrollIntoView({ behavior: "smooth", block: "center" });
      } else if (db) {
        const item = expList().find(x => x.id === db.dataset.del);
        if (item && confirm("刪除「" + item.name + "」？")) expDelete(item.id);
      }
    });

    resetForm();
    fxLoad();
    refreshExpenses(); // 先畫未登入態；登入後由 onAuthStateChanged → expWatch 接手
  })();

  activate("info");
})();
</script>
</body>
</html>
